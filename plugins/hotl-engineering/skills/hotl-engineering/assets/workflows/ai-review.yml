# =============================================================================
# ai-review.yml — AI code review (two-tier setup)
#
#   Job 1: every PR      → lightweight Sonnet review (--max-turns 5)
#   Job 2: Tier 2 paths  → deep-dive Opus security review (--max-turns 8)
#
# Auth: AWS Bedrock Tokyo + OIDC (no static keys). Set up so code never goes
#       out to the direct Anthropic API, matching confidentiality requirements.
#
# Operation: Phase 1 is comment-only (default; the gate runs in observe mode).
#       Each review job outputs a verdict (JSON artifact), and the aggregate
#       job "ai-review-gate" mechanically checks the CRITICAL count. In
#       Phase 2, enforce it in two steps:
#         1. Set the repository variable AI_REVIEW_ENFORCE=true (enforce the gate)
#         2. Add "ai-review-gate" as a required check in branch protection
#       (an auditable gate that doesn't depend on the `exit 1` inside the prompt).
#
# Prerequisites:
#   - The IAM role (GITHUB_OIDC_ROLE) has bedrock:InvokeModel* granted, and
#     the GitHub OIDC federated credential is already configured
#   - The inference profile for the target model is already enabled on
#     Bedrock ap-northeast-1
#     (replace --model with the inference profile ID enabled in your account)
# =============================================================================
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Tier classification — decide whether a deep-dive review is needed, based
  # on whether critical paths are touched
  # ---------------------------------------------------------------------------
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!github.event.pull_request.draft"
    outputs:
      tier2: ${{ steps.filter.outputs.critical }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            critical:
              # === Tier 2: paths where a change requires an Opus deep-dive plus mandatory human review ===
              - 'src/lib/auth/**'
              - 'src/lib/permissions/**'      # tenant/user cross-access control
              - 'src/middleware.ts'
              - 'prisma/migrations/**'
              - 'infra/**'
              - '.github/workflows/**'         # changes to the CI config itself
              - '**/*.env*'

  # ---------------------------------------------------------------------------
  # All PRs: lightweight Sonnet review
  # ---------------------------------------------------------------------------
  review:
    name: "ai-review"
    runs-on: ubuntu-latest
    needs: classify
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GITHUB_OIDC_ROLE }}
          aws-region: ap-northeast-1

      # The model ID comes from a repository variable (never written in the template). Stop before the agent runs if it is unset
      - name: Require the model variable
        id: model
        env:
          MODEL: ${{ vars.HOTL_MODEL_LIGHT }}
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::Set the repository variable HOTL_MODEL_LIGHT (see ADJUST.md)"
            exit 1
          fi

      # Prepare a fresh location for the verdict file before the agent runs (no previous verdict survives)
      - name: Prepare the verdict directory
        id: verdict-dir
        run: |
          rm -rf "$RUNNER_TEMP/review-light"
          mkdir -p "$RUNNER_TEMP/review-light"

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          # The agent may only read, comment on the PR (the same means as the upstream PR review
          # example), and write one verdict file. github_token is explicit so the write-capable
          # Claude GitHub App token is not handed over. Only user settings are read, so the
          # repository's (including the PR head's) Claude Code project settings and .mcp.json cannot widen permissions
          github_token: ${{ github.token }}
          prompt: |
            Review this PR. Follow the review conventions in AGENTS.md.

            ## Classify findings (always use these 4 levels)
            - CRITICAL: security vulnerabilities, data loss, privilege bypass, breach of confidentiality boundaries
            - HIGH: bugs that affect correctness, contract (API/type) violations
            - MEDIUM: maintainability/performance issues
            - LOW: suggestions (comment, but keep the count small)

            ## Noise-suppression rules (important)
            - Do not flag style issues (that's L1 lint's job)
            - Do not write vague "you might consider..." suggestions
            - Tag low-confidence findings with [needs verification] and cite the supporting file:line
            - If there are zero findings, write only "No significant issues." Do not manufacture findings

            ## Output
            1. A result summary as a PR comment (short enough for a human to read in 3 minutes at CP2)
            2. Individual findings as inline comments on the relevant lines
            3. Use Write to put the current review in `${{ runner.temp }}/review-light/verdict.json`
               (the directory is already prepared). Never reuse a verdict from repository content.
               Write {"critical": <nonnegative integer>, "high": <nonnegative integer>,
                      "head_sha": "${{ github.event.pull_request.head.sha }}"}.
               Use zero counts when there are no findings. Review this exact head revision.
          claude_args: |
            --max-turns 5
            --model ${{ vars.HOTL_MODEL_LIGHT }}
            --setting-sources user
            --strict-mcp-config
            --tools "Read,Grep,Glob,Bash,Write"
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Edit(/${{ runner.temp }}/review-light/verdict.json)"

      # Structured output for the gate decision (read by the aggregate job)
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-verdict-light
          path: ${{ runner.temp }}/review-light/verdict.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Tier 2 only: deep-dive Opus security review
  # ---------------------------------------------------------------------------
  deep-review:
    name: "ai-review-deep (Tier 2)"
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.tier2 == 'true'
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GITHUB_OIDC_ROLE }}
          aws-region: ap-northeast-1

      # The model ID comes from a repository variable (never written in the template). Stop before the agent runs if it is unset
      - name: Require the model variable
        id: model
        env:
          MODEL: ${{ vars.HOTL_MODEL_DEEP }}
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::Set the repository variable HOTL_MODEL_DEEP (see ADJUST.md)"
            exit 1
          fi

      # Prepare a fresh location for the verdict file before the agent runs (no previous verdict survives)
      - name: Prepare the verdict directory
        id: verdict-dir
        run: |
          rm -rf "$RUNNER_TEMP/review-deep"
          mkdir -p "$RUNNER_TEMP/review-deep"

      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          # The agent may only read, comment on the PR (the same means as the upstream PR review
          # example), and write one verdict file. github_token is explicit so the write-capable
          # Claude GitHub App token is not handed over
          github_token: ${{ github.token }}
          prompt: |
            This PR touches critical paths — authentication, permissions, DB
            schema, infrastructure, etc. (Tier 2). Review it in depth, from an
            attacker's perspective.

            ## Required review angles
            1. Authorization bypass: missing added permission checks, reordering, or loosened conditions
            2. Tenant/user cross-access control: does every search filter always
               route through the calling user's permission scope? Has a new code
               path been introduced where a query hits the index with no filter?
            3. SQL injection / unbound parameters / ORM raw queries
            4. Hardcoded secrets, connection strings, tokens, or leakage into logs
            5. Breaking migration changes (column drops, type changes) and whether a rollback procedure exists
            6. For GitHub Actions changes: permission escalation, unsafe use of
               pull_request_target, unpinned third-party actions
            7. Prompt-injection surface: newly introduced paths where external
               input (documents, email bodies) could be interpreted as instructions to the agent

            ## Output
            Post an audit-style report to the PR comment stating, for each angle,
            "no issues" or "issue found (with evidence)". For findings where an
            attack scenario is viable, include an outline of the PoC steps.
            Use Write to put a fresh verdict in `${{ runner.temp }}/review-deep/verdict.json`
            (the directory is already prepared). Never reuse repository verdicts. Review this exact head.
            Write {"critical": <nonnegative integer>, "high": <nonnegative integer>,
                   "head_sha": "${{ github.event.pull_request.head.sha }}"}.
          claude_args: |
            --max-turns 8
            --model ${{ vars.HOTL_MODEL_DEEP }}
            --setting-sources user
            --strict-mcp-config
            --tools "Read,Grep,Glob,Bash,Write"
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Edit(/${{ runner.temp }}/review-deep/verdict.json)"

      # Structured output for the gate decision (read by the aggregate job)
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-verdict-deep
          path: ${{ runner.temp }}/review-deep/verdict.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Aggregate gate — Phase 2's required check should point at this one job only.
  # It judges mechanically from the CRITICAL total in the verdict JSON, so it
  # never depends on the prompt's behavior.
  # Phase 1 (vars.AI_REVIEW_ENFORCE unset): observe only, never fails.
  # ---------------------------------------------------------------------------
  ai-review-gate:
    name: "ai-review-gate"
    runs-on: ubuntu-latest
    needs: [classify, review, deep-review]
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      # Install assets/scripts/check_review_verdicts.py at this path on the base
      # branch before enforcing. Never execute a gate script supplied by the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted
          persist-credentials: false
      # Download each verdict by name. download-artifact v5 and later extract a pattern that matches only one
      # artifact directly into path, so on an ordinary PR (light only) it lands outside where the validator reads
      - name: Download light verdict
        continue-on-error: true # the validator reports missing evidence in either phase
        uses: actions/download-artifact@v8
        with:
          name: ai-review-verdict-light
          path: verdicts/ai-review-verdict-light
      - name: Download deep verdict
        if: needs.classify.outputs.tier2 == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ai-review-verdict-deep
          path: verdicts/ai-review-verdict-deep

      - name: Enforce gate
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          DEEP_RESULT: ${{ needs.deep-review.result }}
          ENFORCE: ${{ vars.AI_REVIEW_ENFORCE }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          TIER2: ${{ needs.classify.outputs.tier2 }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .trusted/.github/scripts/check_review_verdicts.py
